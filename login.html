<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Black Ink Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<div class="auth-bg"></div>
<a href="/" class="auth-back">← BACK TO SITE</a>
<main class="auth-card">
  <a href="/"><img src="assets/logo-wordmark.png" alt="Black Ink Studios" class="auth-logo"></a>
  <h1>Welcome back</h1>
  <p class="sub">Log in to your account</p>
  <form id="authForm" data-mode="login" novalidate>
    <label>Email<input type="email" name="email" autocomplete="email" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <div class="form-msg" id="msg" role="alert"></div>
    <button class="btn" type="submit"><span>LOG IN</span><i class="arrow"></i></button>
  </form>
  <p class="switch">New here? <a href="/signup">Create an account</a></p>
</main>
<script src="js/auth.js"></script>
</body>
</html>
